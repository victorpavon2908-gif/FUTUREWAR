name: Godot Project Check

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project and parse scripts
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Smoke test command interface
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 15

      - name: Smoke test active production world
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 60 res://scenes/main.tscn

      - name: Smoke test Coastline Fortress
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 60 res://scenes/coastline_fortress.tscn

      - name: Smoke test Aster Valley legacy scene
        run: |
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 60 res://scenes/aster_valley.tscn
